<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rich-render</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/app.js"></script>
<script>RichRender.applyStoredTheme();</script>
</head>
<body>

<div class="topbar">
  <span class="home">rich-render</span>
  <span class="spacer"></span>
  <span id="stamp" class="stamp"></span>
  <button class="btn" id="theme">Theme</button>
</div>

<div class="shell">
  <main class="doc" style="padding-top:0">
    <header class="index-head">
      <h1>Rendered documents</h1>
      <p id="sub">Plans, derivations and diagrams from this machine.</p>
    </header>
    <div id="sessions"></div>
  </main>
</div>

<script>
(function () {
  const R = window.RichRender;
  const host = document.getElementById('sessions');
  let signature = '';

  function card(sessionId, doc) {
    const href = '/doc/' + encodeURIComponent(sessionId) + '/' + encodeURIComponent(doc.slug);
    const kind = doc.kind && doc.kind !== 'doc'
      ? '<span class="badge">' + R.escapeHtml(doc.kind) + '</span>' : '';
    const summary = doc.summary
      ? '<p class="card-sum">' + R.escapeHtml(doc.summary) + '</p>' : '';
    return '<a class="card" href="' + href + '">' + kind +
      '<div class="card-title">' + R.escapeHtml(doc.title) + '</div>' + summary +
      '<div class="card-when">' + R.relativeTime(doc.modified) + '</div></a>';
  }

  function render(data) {
    if (!data.sessions.length) {
      host.innerHTML = '<div class="empty">No documents yet.<br><br>' +
        'Ask Claude for a plan, a derivation, or a flow diagram &#8212; ' +
        'or run <code>/rich-render render &lt;topic&gt;</code>.</div>';
      return;
    }
    host.innerHTML = data.sessions.map(function (s) {
      return '<section class="session">' +
        '<div class="session-head">' +
          '<h2>' + R.escapeHtml(s.project || s.id) + '</h2>' +
          '<span class="path">' + R.escapeHtml(s.cwd || '') + '</span>' +
          '<span class="when">' + R.relativeTime(s.created) + '</span>' +
        '</div>' +
        '<div class="cards">' + s.docs.map(function (d) { return card(s.id, d); }).join('') + '</div>' +
      '</section>';
    }).join('');
  }

  async function refresh() {
    try {
      const res = await fetch('/__rich_render/index.json', { cache: 'no-store' });
      const data = await res.json();
      const next = JSON.stringify(data.sessions.map(function (s) {
        return [s.id, s.docs.map(function (d) { return d.slug + ':' + d.mtime; })];
      }));
      if (next !== signature) { signature = next; render(data); }
      const count = data.sessions.reduce(function (n, s) { return n + s.docs.length; }, 0);
      document.getElementById('sub').textContent =
        count + (count === 1 ? ' document' : ' documents') + ' across ' +
        data.sessions.length + (data.sessions.length === 1 ? ' session' : ' sessions') + '.';
    } catch (err) {
      document.getElementById('stamp').textContent = 'server offline';
    }
  }

  document.getElementById('theme').addEventListener('click', function () { R.toggleTheme(); });

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
